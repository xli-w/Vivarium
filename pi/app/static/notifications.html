<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Libbys Vivarium - Notifications</title><link rel="stylesheet" href="styles.css"></head>
<body data-page="notifications"><main class="shell"><header class="topbar" data-dashboard-header data-eyebrow="LIBBYS VIVARIUM" data-title="Notifications"></header><nav class="section-nav" aria-label="Dashboard sections" data-dashboard-nav></nav>
<div class="alarm-strip loading" id="alarmStrip" aria-live="polite"><span class="alarm-dot"></span><div><strong id="alarmTitle">Waiting for telemetry...</strong><span id="alarmDetail">The dashboard has not confirmed the current system state.</span></div></div>
<section class="panel dashboard-section"><div class="panel-heading"><div><p class="eyebrow">NOTIFICATIONS</p><h2>Active & Recent</h2></div><span class="updated" id="notificationState">Loading</span></div><div class="notification-summary" id="notificationSummary"></div><div class="history-alarm-list" id="notificationList" role="list"><span class="muted">No notifications loaded.</span></div></section>
<section class="panel dashboard-section"><div class="panel-heading"><div><p class="eyebrow">EMAILS</p><h2>Delivery Status</h2></div><span class="updated" id="emailDeliveryState">Loading</span></div><div class="diagnostic-grid" id="emailDeliveryGrid"><span class="muted">Waiting for notification data.</span></div></section>
<footer data-dashboard-footer></footer></main><script src="app.js" defer></script></body></html>
